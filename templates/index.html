<!DOCTYPE html>
<html>
<head>
    <title>Docker Demo</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            color:white;
        }

        .card{
            background:white;
            color:#333;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,.3);
            width:400px;
        }

        h1{
            color:#2a5298;
        }

        p{
            font-size:18px;
        }

        button{

            padding:12px 25px;
            background:#2a5298;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{

            background:#1e3c72;
        }

    </style>

</head>

<body>

<div class="card">

<h1>🐳 Docker Demo</h1>

<p>This webpage is running!</p>

<button onclick="alert('Congratulations! Your app is working.')">
Click Me
</button>

</div>

</body>
</html>
